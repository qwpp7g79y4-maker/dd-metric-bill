name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: CI on the tagged commit
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.target }}
    needs: ci
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
            macos_min: "10.12"
          - target: aarch64-apple-darwin
            os: macos-latest
            macos_min: "11.0"
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_min }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Check the glibc baseline
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          newest=$(objdump -T target/${{ matrix.target }}/release/dd-metric-bill | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "newest symbol version: $newest"
          # The README promises glibc 2.34 or newer.
          test "$(printf '%s\n' "$newest" GLIBC_2.34 | sort -V | tail -1)" = GLIBC_2.34
      - name: Package
        shell: bash
        run: |
          name="dd-metric-bill-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp README.md README.nl.md LICENSE-MIT LICENSE-APACHE CHANGELOG.md "dist/$name/"
          cp -R docs "dist/$name/"
          mkdir -p "dist/$name/tests/fixtures"
          cp tests/fixtures/b1-count.dogstatsd \
            tests/fixtures/b1-histogram.dogstatsd \
            tests/fixtures/diff-old.dogstatsd \
            tests/fixtures/diff-new.dogstatsd \
            tests/fixtures/empty.dogstatsd \
            "dist/$name/tests/fixtures/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "../target/${{ matrix.target }}/release/dd-metric-bill.exe" "$name/"
            7z a -tzip "$name.zip" "$name" > /dev/null
            sha256sum "$name.zip" > "$name.zip.sha256"
          else
            cp "../target/${{ matrix.target }}/release/dd-metric-bill" "$name/"
            tar -czf "$name.tar.gz" "$name"
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
          rm -rf "$name"
      - name: Smoke test the archive
        shell: bash
        run: |
          name="dd-metric-bill-${GITHUB_REF_NAME}-${{ matrix.target }}"
          expected="dd-metric-bill ${GITHUB_REF_NAME#v}"
          mkdir smoke
          cd smoke
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z x "../dist/$name.zip" > /dev/null
            got=$("./$name/dd-metric-bill.exe" --version | tr -d '\r')
          else
            tar -xzf "../dist/$name.tar.gz"
            got=$("./$name/dd-metric-bill" --version)
          fi
          echo "$got"
          test "$got" = "$expected"
          test -f "$name/README.nl.md"
          test -f "$name/docs/reference.md"
          test -f "$name/docs/reference.nl.md"
          test -f "$name/tests/fixtures/b1-count.dogstatsd"
          test -f "$name/tests/fixtures/b1-histogram.dogstatsd"
          test -f "$name/tests/fixtures/diff-old.dogstatsd"
          test -f "$name/tests/fixtures/diff-new.dogstatsd"
          test -f "$name/tests/fixtures/empty.dogstatsd"
          if [ "${{ runner.os }}" = "Windows" ]; then
            total=$(cd "$name" && ./dd-metric-bill.exe count tests/fixtures/b1-count.dogstatsd | head -n 1 | tr -d '\r')
          else
            total=$(cd "$name" && ./dd-metric-bill count tests/fixtures/b1-count.dogstatsd | head -n 1)
          fi
          test "$total" = "total: 4"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --title "dd-metric-bill $GITHUB_REF_NAME" --notes-file ../notes.md --verify-tag ./*
